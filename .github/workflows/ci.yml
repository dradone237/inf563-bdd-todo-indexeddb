# Intégration continue : chaque push (sur n'importe quelle branche) et chaque pull request
# lance les tests unitaires avec couverture, le test de mutation, puis les scénarios BDD.
# Chaque étape a son seuil : sous le seuil, le pipeline est rouge et on ne fusionne pas.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:   # bouton « Run workflow » pour relancer à la main

jobs:
  tests:
    name: "Tests unitaires, mutation et scénarios BDD (To-Do IndexedDB)"
    # Version figée plutôt que « ubuntu-latest », qui change d'Ubuntu sans prévenir :
    # le pipeline reste reproductible.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Installer les dépendances (versions figées par package-lock.json)
        run: npm ci

      - name: Tests unitaires (Vitest) + couverture (Istanbul) - seuils dans vitest.config.js
        run: npm run test:couverture

      - name: Test de mutation (StrykerJS) - seuil dans stryker.config.mjs
        run: npm run test:mutation

      # Pas d'étape « playwright install » (elle restait bloquée sur le téléchargement) :
      # les scénarios utilisent le Google Chrome préinstallé sur la machine.
      - name: Scénarios BDD (Cucumber + Playwright) + couverture - seuils dans .nycrc.json
        run: npm run test:bdd:couverture
        env:
          CANAL: chrome

      - name: Publier les rapports (même en cas d'échec)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapports-tests
          path: rapports/
